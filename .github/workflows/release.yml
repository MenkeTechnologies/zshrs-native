name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Four runtimes in one binary — the shell, gitoxide, arb and stryke — under
    # `lto = "fat"` and `codegen-units = 1`. This is the longest build in the
    # fleet by a wide margin; zshrs alone allows 180.
    timeout-minutes: 360
    # Per-target failures are tolerated on the variants that carry C
    # dependencies awkwardly, so the publish + tap jobs ship from whichever
    # targets did build. `needs: build` is satisfied either way.
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS native ---
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # --- Linux glibc native ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # --- Linux musl static ---
          # zvcs's vendored gitoxide reaches libz/openssl through its transport
          # stack and strykelang links git2 + symphonia, so a fully static musl
          # link is the variant most likely to break. Allowed to fail so it
          # never blocks a release.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            allow_failure: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            allow_failure: true
    steps:
      - uses: actions/checkout@v6
        with:
          # The four runtimes are vendor/ submodules and zvcs carries its own
          # vendored gitoxide in-tree, so a shallow non-recursive checkout has
          # nothing to build.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install native deps (ncurses, tinfo, gdbm, cap, sqlite3)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev libtinfo-dev libgdbm-dev libcap-dev libsqlite3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build zshrs (fat)
        run: cargo build --release --locked --bin zshrs --target ${{ matrix.target }}

      # The three binaries the `-all` package ships beside the shell. `zd` and
      # `zshrs-recorder` are bin targets of the zshrs PACKAGE, gated behind its
      # `zd` / `recorder` features, and a path dependency is not a workspace
      # member — `cargo build -p zshrs --features zshrs/zd` is refused with
      # "cannot specify features for packages outside of workspace", and
      # without the flag the target itself is refused for want of them. So they
      # are built through the submodule's own manifest, which costs a second
      # compile of the zshrs lib under that feature set. `zshrs-daemon` is a
      # separate package and needs no features, so `-p` reaches it from here
      # and it reuses everything this build already compiled.
      #
      # Tolerated failure: a target that cannot produce these still ships its
      # plain `zshrs` tarball. The packaging step below emits the `-all`
      # tarball only when all four binaries are present.
      - name: Build zd, zshrs-recorder, zshrs-daemon
        id: aux
        continue-on-error: true
        run: |
          cargo build --release --locked --manifest-path vendor/zshrs/Cargo.toml \
            --features zd,recorder --bin zd --bin zshrs-recorder \
            --target ${{ matrix.target }}
          cargo build --release --locked -p zshrs-daemon --bin zshrs-daemon \
            --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          V="${{ github.ref_name }}"
          T="${{ matrix.target }}"
          stage="$(mktemp -d)"
          cp "target/$T/release/zshrs" "$stage/"
          tar czf "zshrs-native-$V-$T.tar.gz" -C "$stage" zshrs
          # `-all`: the shell plus the daemon, its standalone client and the
          # recorder — the same set `zshrs-all` ships, with the fat shell in
          # place of the thin one.
          # `if`, not `[ … ] && cp`: under `set -e` a false test on the last
          # iteration ends the step, and a missing binary here is the expected
          # case, not a failure.
          for b in "target/$T/release/zshrs-daemon" \
                   "vendor/zshrs/target/$T/release/zd" \
                   "vendor/zshrs/target/$T/release/zshrs-recorder"; do
            if [ -f "$b" ]; then cp "$b" "$stage/"; fi
          done
          # The root release profile strips; the submodule's own profile is not
          # this package's to dictate, so strip whatever is left over here.
          ( cd "$stage" && strip zd zshrs-recorder zshrs-daemon 2>/dev/null || true )
          if [ -f "$stage/zd" ] && [ -f "$stage/zshrs-recorder" ] && [ -f "$stage/zshrs-daemon" ]; then
            tar czf "zshrs-native-all-$V-$T.tar.gz" -C "$stage" \
              zshrs zd zshrs-recorder zshrs-daemon
          else
            echo "auxiliary binaries missing for $T — shipping the plain tarball only"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: zshrs-native-${{ matrix.target }}
          # Both tarballs when the target produced them; the glob quietly
          # matches one file when it did not.
          path: zshrs-native*-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.tar.gz

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        shell: bash
        run: |
          # zshrs-native-vX.Y.Z-<target>.tar.gz      → <target with _ for ->
          # zshrs-native-all-vX.Y.Z-<target>.tar.gz  → all_<same>
          #
          # The `-all` case is matched FIRST: its name also begins
          # `zshrs-native-`, so the plain pattern would leave `all_…` embedded
          # in the key and the two packages would fight over one output.
          for f in artifacts/*.tar.gz; do
            base=$(basename "$f")
            sum=$(sha256sum "$f" | awk '{print $1}')
            if [[ "$base" == zshrs-native-all-* ]]; then
              key="all_$(echo "$base" | perl -pe 's/zshrs-native-all-v[^-]*-//; s/\.tar\.gz//; s/-/_/g')"
            else
              key=$(echo "$base" | perl -pe 's/zshrs-native-v[^-]*-//; s/\.tar\.gz//; s/-/_/g')
            fi
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v6
        with:
          repository: MenkeTechnologies/homebrew-menketech
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update zshrs-native formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA_ARM_MACOS: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          SHA_X86_MACOS: ${{ steps.sha.outputs.x86_64_apple_darwin }}
          SHA_X86_LINUX: ${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}
          SHA_ARM_LINUX: ${{ steps.sha.outputs.aarch64_unknown_linux_gnu }}
          SHA_X86_LINUX_MUSL: ${{ steps.sha.outputs.x86_64_unknown_linux_musl }}
          SHA_ARM_LINUX_MUSL: ${{ steps.sha.outputs.aarch64_unknown_linux_musl }}
        run: |
          set -eu
          V="${VERSION#v}"
          BASE="https://github.com/MenkeTechnologies/zshrs-native/releases/download/v${V}"
          # Emit an on_arm / on_intel block only when its SHA is non-empty, so a
          # target that failed to build leaves the formula valid instead of
          # writing a block with an empty sha256.
          emit() { local guard="$1" arch="$2" sha="$3"; [ -n "$sha" ] || return 0; printf '    %s do\n      url "%s/zshrs-native-v%s-%s.tar.gz"\n      sha256 "%s"\n    end\n' "$guard" "$BASE" "$V" "$arch" "$sha"; }
          mac_blocks=$( { emit on_arm aarch64-apple-darwin "$SHA_ARM_MACOS"; emit on_intel x86_64-apple-darwin "$SHA_X86_MACOS"; } )
          linux_blocks=$( { emit on_intel x86_64-unknown-linux-gnu "$SHA_X86_LINUX"; emit on_arm aarch64-unknown-linux-gnu "$SHA_ARM_LINUX"; } )
          {
            printf 'class ZshrsNative < Formula\n'
            printf '  desc "zshrs with git, arb and stryke compiled in as no-fork builtins"\n'
            printf '  homepage "https://github.com/MenkeTechnologies/zshrs-native"\n'
            printf '  license "MIT"\n'
            # All three install a binary named `zshrs`.
            printf '  conflicts_with "zshrs", because: "both install zshrs"\n'
            printf '  conflicts_with "zshrs-all", because: "both install zshrs"\n'
            printf '  version "%s"\n\n' "$V"
            if [ -n "$mac_blocks" ]; then
              printf '  on_macos do\n%s\n  end\n\n' "$mac_blocks"
            fi
            if [ -n "$linux_blocks" ]; then
              printf '  on_linux do\n%s\n  end\n\n' "$linux_blocks"
            fi
            printf '  def install\n'
            printf '    bin.install "zshrs"\n'
            printf '  end\n\n'
            printf '  test do\n'
            printf '    assert_match "hi", shell_output("#{bin}/zshrs -c '"'"'echo hi'"'"'")\n'
            printf '  end\n'
            # Homebrew has no on_libc gate, so the static musl tarballs are
            # referenced by URL for Alpine / scratch / distroless users.
            if [ -n "$SHA_X86_LINUX_MUSL" ] || [ -n "$SHA_ARM_LINUX_MUSL" ]; then
              printf '\n  # Static musl tarballs also published at this release:\n'
              # `if`, not `[ … ] &&`: under `set -e` a false test at the end of an
              # AND-list ends the step, and the two musl targets are exactly the
              # ones allowed to fail — one built, one not, and the formula would
              # have been truncated before its final `end`.
              if [ -n "$SHA_X86_LINUX_MUSL" ]; then
                printf '  #   zshrs-native-v%s-x86_64-unknown-linux-musl.tar.gz  sha256: %s\n' "$V" "$SHA_X86_LINUX_MUSL"
              fi
              if [ -n "$SHA_ARM_LINUX_MUSL" ]; then
                printf '  #   zshrs-native-v%s-aarch64-unknown-linux-musl.tar.gz  sha256: %s\n' "$V" "$SHA_ARM_LINUX_MUSL"
              fi
            fi
            printf 'end\n'
          } > tap/Formula/zshrs-native.rb

      # The daily-driver package: the same four binaries `zshrs-all` ships,
      # with the fat shell in place of the thin one. Separate tarballs, so it
      # gets its own SHA keys (`all_<target>`) and its own formula.
      - name: Update zshrs-native-all formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA_ARM_MACOS: ${{ steps.sha.outputs.all_aarch64_apple_darwin }}
          SHA_X86_MACOS: ${{ steps.sha.outputs.all_x86_64_apple_darwin }}
          SHA_X86_LINUX: ${{ steps.sha.outputs.all_x86_64_unknown_linux_gnu }}
          SHA_ARM_LINUX: ${{ steps.sha.outputs.all_aarch64_unknown_linux_gnu }}
        run: |
          set -eu
          V="${VERSION#v}"
          BASE="https://github.com/MenkeTechnologies/zshrs-native/releases/download/v${V}"
          emit() { local guard="$1" arch="$2" sha="$3"; [ -n "$sha" ] || return 0; printf '    %s do\n      url "%s/zshrs-native-all-v%s-%s.tar.gz"\n      sha256 "%s"\n    end\n' "$guard" "$BASE" "$V" "$arch" "$sha"; }
          mac_blocks=$( { emit on_arm aarch64-apple-darwin "$SHA_ARM_MACOS"; emit on_intel x86_64-apple-darwin "$SHA_X86_MACOS"; } )
          linux_blocks=$( { emit on_intel x86_64-unknown-linux-gnu "$SHA_X86_LINUX"; emit on_arm aarch64-unknown-linux-gnu "$SHA_ARM_LINUX"; } )
          # A release where no target produced the four binaries writes no
          # formula at all rather than one with no platform block in it.
          if [ -z "$mac_blocks" ] && [ -z "$linux_blocks" ]; then
            echo "no -all tarballs in this release — leaving the formula alone"
            exit 0
          fi
          {
            printf 'class ZshrsNativeAll < Formula\n'
            printf '  desc "Full zshrs-native install — fat shell + zd client + recorder + daemon"\n'
            printf '  homepage "https://github.com/MenkeTechnologies/zshrs-native"\n'
            printf '  license "MIT"\n'
            # Every one of these installs a binary named `zshrs` or `zd`.
            printf '  conflicts_with "zshrs", because: "both install zshrs and zd"\n'
            printf '  conflicts_with "zshrs-all", because: "both install zshrs and zd"\n'
            printf '  conflicts_with "zshrs-daemon", because: "both install zshrs-daemon and zd"\n'
            printf '  conflicts_with "zshrs-native", because: "both install zshrs"\n'
            printf '  version "%s"\n\n' "$V"
            if [ -n "$mac_blocks" ]; then
              printf '  on_macos do\n%s\n  end\n\n' "$mac_blocks"
            fi
            if [ -n "$linux_blocks" ]; then
              printf '  on_linux do\n%s\n  end\n\n' "$linux_blocks"
            fi
            printf '  def install\n'
            printf '    bin.install "zshrs"\n'
            printf '    bin.install "zd"\n'
            printf '    bin.install "zshrs-recorder"\n'
            printf '    bin.install "zshrs-daemon"\n'
            printf '  end\n\n'
            printf '  test do\n'
            printf '    assert_match "hi", shell_output("#{bin}/zshrs -c '"'"'echo hi'"'"'")\n'
            printf '    assert_predicate bin/"zd", :exist?\n'
            printf '    assert_predicate bin/"zshrs-recorder", :exist?\n'
            printf '    assert_predicate bin/"zshrs-daemon", :exist?\n'
            printf '  end\n'
            printf 'end\n'
          } > tap/Formula/zshrs-native-all.rb

      - name: Push formula update
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `-all` may legitimately be absent from a release in which no target
          # produced the four binaries; `git add` on a missing path is an error,
          # so it is added only when the step above wrote it.
          git add Formula/zshrs-native.rb
          if [ -f Formula/zshrs-native-all.rb ]; then
            git add Formula/zshrs-native-all.rb
          fi
          if git diff --cached --quiet; then
            echo "no changes — formula already up to date"
            exit 0
          fi
          git commit -m "zshrs-native: bump to ${{ github.ref_name }}"
          git push
